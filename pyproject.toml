[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fextract"
version = "0.1.0"
description = "Trust-aware finance document field extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["click>=8.1", "pydantic>=2.6", "PyMuPDF>=1.23", "Pillow>=10", "joblib>=1.3", "pdfplumber>=0.11.4", "pytesseract>=0.3.13"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "ruff>=0.3", "black>=24"]

[project.scripts]
fextract = "fextract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
