
[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fextract"
version = "0.1.0"
description = "Trust-aware finance document field extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "click==8.3.1",
    "pydantic==2.14.2",
    "PyMuPDF==1.27.2.2",
    "Pillow==13.0.0",
    "joblib==1.6.0",
    "pdfplumber==0.11.4",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.10",
    "black==26.1.0",
]

[project.scripts]
fextract = "fextract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
